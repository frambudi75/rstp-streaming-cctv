<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#favBg)" stroke="#2563eb" stroke-width="2" />

  <!-- Camera Body -->
  <rect x="6" y="9" width="20" height="15" rx="3.5" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2" />
  
  <!-- Camera Lens -->
  <circle cx="16" cy="16.5" r="5.5" fill="url(#favLens)" stroke="#93c5fd" stroke-width="1.2" />
  <circle cx="14.5" cy="15" r="1.5" fill="#ffffff" />

  <!-- Live Pulse Red Dot -->
  <circle cx="22" cy="12" r="1.8" fill="#ef4444" />
  <circle cx="22" cy="12" r="0.7" fill="#ffffff" />
</svg>
