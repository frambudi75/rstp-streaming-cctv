<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="2.5" />
  
  <!-- Outer Corner Tech Brackets -->
  <path d="M 22 34 L 22 22 L 34 22" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <path d="M 98 34 L 98 22 L 86 22" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <path d="M 22 86 L 22 98 L 34 98" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <path d="M 98 86 L 98 98 L 86 98" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- Outer CCTV Housing Body -->
  <rect x="28" y="38" width="64" height="44" rx="10" fill="#1e293b" stroke="url(#blueGrad)" stroke-width="2" />
  
  <!-- Camera Sunshield / Top Hood -->
  <path d="M 24 38 L 96 38 L 88 32 L 32 32 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />

  <!-- Camera Optical Lens Outer Ring -->
  <circle cx="60" cy="60" r="19" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="2" />

  <!-- Lens Glass Inner Reflection -->
  <circle cx="60" cy="60" r="12" fill="url(#irisGrad)" opacity="0.9" />
  <circle cx="56" cy="56" r="4" fill="#ffffff" opacity="0.75" />

  <!-- Targeting Reticle Crosshairs -->
  <line x1="60" y1="36" x2="60" y2="44" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="76" x2="60" y2="84" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="60" x2="44" y2="60" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="60" x2="84" y2="60" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />

  <!-- Live Recording Indicator LED (Pulsing Red) -->
  <circle cx="82" cy="48" r="3.5" fill="#ef4444" filter="url(#glow)" />
  <circle cx="82" cy="48" r="1.5" fill="#ffffff" />

  <!-- RTSP / High-Tech Data Mark -->
  <rect x="36" y="74" width="8" height="2" rx="1" fill="#10b981" />
  <rect x="46" y="74" width="4" height="2" rx="1" fill="#38bdf8" />
</svg>
